name: Regime Check

on:
  schedule:
    # СТРАХОВКА, а не основное расписание. Точное время (07:40 МСК) задаёт
    # таймер на VPS через workflow_dispatch — такие прогоны стартуют за
    # секунды.
    #
    # Раньше здесь стоял cron '10 0 * * *': крон намеренно ставили на 00:10
    # UTC в расчёте, что GitHub задержит его на привычные ~4.5ч и прогон
    # случайно попадёт в 04:40 UTC = 07:40 МСК. Компенсировать задержку
    # задержкой — ненадёжно, и 17.09 это выстрелило: крон лёг ровно на
    # диспатч с VPS, и утреннее сообщение пришло ДВА раза.
    #
    # Слот ниже стоит заведомо позже цели: если VPS отработал, сообщение
    # за сегодня уже ушло; если нет — придёт с опозданием, что само по себе
    # сигнал, что таймер на сервере не сработал.
    - cron: '0 8 * * *'   # 11:00 МСК
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regime-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Regime Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python main.py
      
      - name: Commit state
        run: |
          git config user.name "regime-bot"
          git config user.email "bot@regime-engine.local"
          git add state/ || true
          git diff --cached --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase || true
          git push || true
