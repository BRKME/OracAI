name: LP Intelligence System

on:
  schedule:
    # ── Мониторинг выхода из диапазона: каждые 2 часа ────────────────
    - cron: '50 */2 * * *'

    # ── Попытки попасть в утренний отчёт (~7:00 МСК = 04:00 UTC) ─────
    # GitHub Actions не гарантирует время запуска: по факту задержки
    # 2-114 мин (медиана ~50), разрывы между прогонами до 13.4 часа.
    # Одного слота недостаточно — 29-31.08 утренний отчёт уходил в
    # 10:32, 08:57 и 11:58 МСК вместо 7:00.
    # Три попытки подряд повышают шанс, что хотя бы одна ляжет близко
    # к цели. Дублей не будет: гейт в lp_system.py помечает в
    # state/lp_send_state.json, что утренний отчёт за сегодня отправлен.
    - cron: '30 3 * * *'   # 06:30 МСК
    - cron: '50 3 * * *'   # 06:50 МСК
    - cron: '10 4 * * *'   # 07:10 МСК

    # ── Попытки попасть в вечерний отчёт (~19:00 МСК = 16:00 UTC) ────
    - cron: '30 15 * * *'  # 18:30 МСК
    - cron: '50 15 * * *'  # 18:50 МСК
    - cron: '10 16 * * *'  # 19:10 МСК

  workflow_dispatch:

permissions:
  contents: write

jobs:
  lp-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run LP System
        env:
          ARB_RPC: ${{ secrets.ARB_RPC }}
          BSC_RPC: ${{ secrets.BSC_RPC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
        run: python lp_system.py
      
      - name: Commit state
        run: |
          git config user.name "lp-bot"
          git config user.email "bot@lp-system.local"
          git add state/ || true
          git diff --cached --quiet || git commit -m "LP: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase || true
          git push || true
