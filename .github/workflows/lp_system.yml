name: LP Intelligence System

on:
  schedule:
    # СТРАХОВКА, а не основное расписание. Время задаёт внешний планировщик
    # на VPS через workflow_dispatch: такие прогоны GitHub запускает за
    # секунды, тогда как scheduled на free-tier опаздывают на 2-114 мин и
    # пропускают слоты пачками (замер по 25 прогонам 26-31.08, разрывы 13.4ч).
    #
    # Эти четыре слота нужны на случай, если VPS лёг: без них при мёртвом
    # сервере не запустится вообще ничего. Слоты стоят ПОСЛЕ порогов
    # страховки в _should_send_report (утро 9:30, вечер 20:30 МСК), чтобы
    # не опередить точный диспатч. Если VPS жив — эти прогоны молчат.
    - cron: '40 6 * * *'   # 09:40 МСК
    - cron: '40 9 * * *'   # 12:40 МСК
    - cron: '40 17 * * *'  # 20:40 МСК
    - cron: '40 20 * * *'  # 23:40 МСК

  # Таймеры на сервере (deploy/vps-scheduler/):
  #   07:00 МСК          — утренний отчёт
  #   19:00 МСК          — вечерний отчёт
  #   07:30-23:30 ежечас — мониторинг выхода из диапазона (молчит, если всё
  #                        в диапазоне; ночью не будит)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lp-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run LP System
        env:
          ARB_RPC: ${{ secrets.ARB_RPC }}
          BSC_RPC: ${{ secrets.BSC_RPC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
        run: python lp_system.py
      
      - name: Commit state
        run: |
          git config user.name "lp-bot"
          git config user.email "bot@lp-system.local"
          git add state/ || true
          git diff --cached --quiet || git commit -m "LP: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase || true
          git push || true
